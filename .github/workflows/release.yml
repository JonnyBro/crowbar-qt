name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  linux:
    needs: ci
    # The oldest supported Ubuntu, so the binary's glibc is old enough for most distributions.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the workspace version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the workspace version $version"
            exit 1
          fi

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang pkg-config libfontconfig-dev libfreetype-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libxcb1-dev libvulkan-dev

      - uses: rui314/setup-mold@v1

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked -p prybar

      - name: Pack
        run: |
          name="prybar-$GITHUB_REF_NAME-linux-x86_64"
          mkdir -p "dist/$name"
          cp target/release/prybar LICENSE README.md "dist/$name/"
          cp crates/app/assets/desktop/prybar.desktop crates/app/assets/desktop/prybar.svg \
            crates/app/assets/desktop/prybar.png crates/app/assets/desktop/prybar-mime.xml \
            "dist/$name/"
          # The app updates itself from this archive and expects the binary at <name>/prybar.
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -r "dist/$name"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  release:
    needs: [linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG.md
          files: dist/*
