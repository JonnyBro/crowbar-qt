[package]
name = "prybar"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
gpui-kit = "0.10.0"
# Only for its Lua grammar: gpui-kit doesn't pass tree-sitter features through.
gpui-component = { version = "0.10.0", features = ["tree-sitter-lua"] }
prybar-core = { path = "../core" }
rfd = "0.18.0"
rust-i18n = "4.2.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
smol = "2.0.2"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt", "signal"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "chrono"] }

[lints]
workspace = true
