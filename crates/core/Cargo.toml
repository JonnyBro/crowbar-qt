[package]
name = "prybar-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
crc32fast = "1.5.6"
directories = "6.0.0"
flate2 = "1.1.11"
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
lzma-rs = "0.3.0"
md5 = { version = "0.10.6", package = "md-5" }
reqwest = { version = "0.13.5", features = ["form"] }
rust-i18n = "4.2.4"
rustix = { version = "1.1.6", features = ["process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
sys-locale = "0.3.2"
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "process", "sync", "time", "macros"] }
toml = "1.2.1"
tracing = "0.1.44"

[lints]
workspace = true
